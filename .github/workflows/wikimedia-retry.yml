name: Wikimedia Upload Retry

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days of logs to scan for retryable failures"
        required: true
        type: string
      partner:
        description: "Limit to a single partner hub slug (optional; omit for all partners)"
        required: false
        type: string
        default: ""
      response_url:
        description: "Slack response_url for ephemeral user feedback on failure"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write # assume the AWS role via GitHub OIDC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "wikimedia-retry-${{ github.event.inputs.partner != '' && github.event.inputs.partner || 'all' }}"
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave a writable GITHUB_TOKEN in the runner for later steps.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: pip install boto3==1.43.45 requests==2.34.2

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::283408157088:role/github-actions-ingest-wikimedia
          aws-region: us-east-1

      - name: Run retry pipeline
        env:
          DPLA_SLACK_BOT_TOKEN: ${{ secrets.DPLA_SLACK_BOT_TOKEN }}
          PYTHONPATH: .
        run: |
          python scripts/wikimedia_retry.py \
            --days "${{ github.event.inputs.days }}" \
            --partner "${{ github.event.inputs.partner }}" \
            --response-url "${{ github.event.inputs.response_url }}"
